name: Release

# Builds a Developer ID–signed, notarized, stapled DMG and attaches it to the
# GitHub Release for the pushed v* tag. Requires these repository secrets
# (see README → "Shipping with an Apple Developer account"):
#   MACOS_CERTIFICATE            base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD   password of that .p12
#   KEYCHAIN_PASSWORD            any random string (temporary CI keychain)
#   APPLE_TEAM_ID                your 10-character team ID
#   NOTARY_APPLE_ID              your Apple ID email
#   NOTARY_PASSWORD              an app-specific password for that Apple ID

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Signed and notarized DMG
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Derive version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build and sign
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -project Productive.xcodeproj \
            -scheme Productive \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            build

      - name: Verify signature
        run: |
          codesign --verify --deep --strict --verbose=2 \
            "DerivedData/Build/Products/Release/Productive.app"

      - name: Create DMG
        run: |
          mkdir -p dist/dmg
          cp -R "DerivedData/Build/Products/Release/Productive.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Productive" -srcfolder dist/dmg \
            -ov -format UDZO "dist/Productive.dmg"
          codesign --force --sign "Developer ID Application" \
            --timestamp "dist/Productive.dmg"

      - name: Notarize and staple
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "dist/Productive.dmg" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "dist/Productive.dmg"
          xcrun stapler validate "dist/Productive.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Productive.dmg
          path: dist/Productive.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Productive.dmg
